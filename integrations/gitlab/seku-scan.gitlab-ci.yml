# Seku security scan for GitLab CI.
# Include this file and set the CI/CD variables:
#   SEKU_API_KEY  (masked, protected)  — your vsk_... key
#   SEKU_TARGET   — full URL to scan (https://app.example.com)
# Optional: SEKU_POLICY (default standard), SEKU_FAIL_ON (default high),
#           SEKU_API_URL (default https://sec.erticaz.com/api).
#
# Usage in .gitlab-ci.yml:
#   include:
#     - local: 'integrations/gitlab/seku-scan.gitlab-ci.yml'   # or remote: raw URL

seku_security_scan:
  stage: test
  image: alpine:3.19
  variables:
    SEKU_SARIF_OUT: "seku-results.sarif"
  before_script:
    - apk add --no-cache curl jq
  script:
    # Fetch the runner from your checked-out repo, or vendor it into the image.
    - sh integrations/ci/seku-scan.sh
  artifacts:
    when: always
    paths:
      - seku-results.sarif
    reports:
      # GitLab renders SARIF under the "Security" tab (Ultimate); harmless otherwise.
      sast: seku-results.sarif
  allow_failure: false   # set true to report without blocking the pipeline
